name: Build Core Source Distribution

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-core-source-distribution.yml
      - Core.lvproj
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-source-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'

      - name: Validate Workflow with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/build-core-source-distribution.yml

  source-preflight:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Core Source Distribution Build Spec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repositoryRoot = $env:GITHUB_WORKSPACE
          $projectPath = Join-Path $repositoryRoot 'Core.lvproj'
          $libraryPath = Join-Path $repositoryRoot 'src/Core.lvlib'
          foreach ($path in @($projectPath, $libraryPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required source input is missing: $path"
              }
          }
          $project = [System.Xml.XmlDocument]::new()
          $project.Load($projectPath)
          $libraryItem = $project.SelectSingleNode("//Item[@Name='Core.lvlib' and @Type='Library']")
          if (-not $libraryItem -or $libraryItem.GetAttribute('URL') -cne '../src/Core.lvlib') {
              throw 'Core.lvproj must link its adjacent src/Core.lvlib.'
          }
          $buildSpecs = @($project.SelectNodes("//Item[@Name='core' and @Type='Source Distribution']"))
          if ($buildSpecs.Count -ne 1) {
              throw "Expected exactly one 'core' Source Distribution build specification, found $($buildSpecs.Count)."
          }
          $buildSpec = $buildSpecs[0]
          $specName = $buildSpec.SelectSingleNode("Property[@Name='Bld_buildSpecName']")
          if (-not $specName -or $specName.InnerText -cne 'core') {
              throw "Build specification's Bld_buildSpecName must be 'core'."
          }
          $firstSource = $buildSpec.SelectSingleNode("Property[@Name='Source[0].itemID']")
          if (-not $firstSource -or $firstSource.InnerText -cne '/My Computer/Core.lvlib') {
              throw "Build specification's Source[0] must reference /My Computer/Core.lvlib."
          }
          Write-Host "Validated Core.lvproj's 'core' Source Distribution build specification."

  build-core:
    needs: source-preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, windows-labview2026-core]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Windows Build Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vipm = (& vipm version --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $vipm.edition -cne 'Professional') {
              throw 'VIPM Professional is required on the self-hosted Windows runner.'
          }
          $labview = (& vipm labview list --json | ConvertFrom-Json)
          $installation = @($labview.labview_versions | Where-Object { $_.version_year -eq '2026' -and $_.bitness -eq 64 })
          if ($LASTEXITCODE -ne 0 -or $installation.Count -ne 1) {
              throw 'Exactly one LabVIEW 2026 64-bit installation must be available.'
          }

      - name: Prepare Isolated Build Output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The 'core' Source Distribution spec's Bld_localDestDir/Destination
          # paths are a fixed, non-repo-relative location (same convention as
          # replay's own confirmed-working build spec) -- clear it first so
          # this job's output discovery below is unambiguous, since this
          # runner is dedicated to this repo and nothing else writes here.
          $outputRoot = 'C:\ProgramData\LabVIEW Benchmark Actor Plugins'
          if (Test-Path -LiteralPath $outputRoot) {
              Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }
          "OUTPUT_ROOT=$outputRoot" >> $env:GITHUB_ENV

      - name: Build core Source Distribution
        id: build_core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lvprojPath = Join-Path $env:GITHUB_WORKSPACE 'Core.lvproj'
          if (-not (Test-Path -LiteralPath $lvprojPath -PathType Leaf)) {
              throw "Core.lvproj is missing: $lvprojPath"
          }

          & vipm --labview-version 2026 --labview-bitness 64 build $lvprojPath --lvproj-build-spec core --lvproj-target "My Computer" --build-number ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { throw "vipm build failed with exit code $LASTEXITCODE." }

          # LabVIEW's build engine expands the spec's NI_AB_PROJECTNAME token
          # to the actual project name at build time; discover the resulting
          # folder instead of assuming its expanded name.
          $builtDirs = @(Get-ChildItem -LiteralPath $env:OUTPUT_ROOT -Directory -ErrorAction SilentlyContinue)
          if ($builtDirs.Count -ne 1) {
              throw "Expected exactly one output directory under $env:OUTPUT_ROOT, found $($builtDirs.Count)."
          }
          "BUILD_OUTPUT_DIR=$($builtDirs[0].FullName)" >> $env:GITHUB_ENV
          Write-Host "Built Source Distribution at $($builtDirs[0].FullName)"

      - name: Upload core Source Distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-source-distribution-${{ github.run_id }}
          path: ${{ env.BUILD_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
