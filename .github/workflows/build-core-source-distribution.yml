name: Build Core Source Distribution

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-core-source-distribution.yml
      - Core.lvproj
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-source-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'

      - name: Validate Workflow with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/build-core-source-distribution.yml

  source-preflight:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Core Source Distribution Build Spec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repositoryRoot = $env:GITHUB_WORKSPACE
          $projectPath = Join-Path $repositoryRoot 'Core.lvproj'
          $libraryPath = Join-Path $repositoryRoot 'src/Core.lvlib'
          foreach ($path in @($projectPath, $libraryPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required source input is missing: $path"
              }
          }
          $project = [System.Xml.XmlDocument]::new()
          $project.Load($projectPath)
          $libraryItem = $project.SelectSingleNode("//Item[@Name='Core.lvlib' and @Type='Library']")
          if (-not $libraryItem -or $libraryItem.GetAttribute('URL') -cne '../src/Core.lvlib') {
              throw 'Core.lvproj must link its adjacent src/Core.lvlib.'
          }
          $buildSpecs = @($project.SelectNodes("//Item[@Name='core' and @Type='Source Distribution']"))
          if ($buildSpecs.Count -ne 1) {
              throw "Expected exactly one 'core' Source Distribution build specification, found $($buildSpecs.Count)."
          }
          $buildSpec = $buildSpecs[0]
          $specName = $buildSpec.SelectSingleNode("Property[@Name='Bld_buildSpecName']")
          if (-not $specName -or $specName.InnerText -cne 'core') {
              throw "Build specification's Bld_buildSpecName must be 'core'."
          }
          $firstSource = $buildSpec.SelectSingleNode("Property[@Name='Source[0].itemID']")
          if (-not $firstSource -or $firstSource.InnerText -cne '/My Computer/Core.lvlib') {
              throw "Build specification's Source[0] must reference /My Computer/Core.lvlib."
          }
          Write-Host "Validated Core.lvproj's 'core' Source Distribution build specification."

  build-core:
    needs: source-preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, windows-labview2026-core]
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Windows Build Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vipm = (& vipm version --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $vipm.edition -cne 'Professional') {
              throw 'VIPM Professional is required on the self-hosted Windows runner.'
          }
          $labview = (& vipm labview list --json | ConvertFrom-Json)
          $installation = @($labview.labview_versions | Where-Object { $_.version_year -eq '2026' -and $_.bitness -eq 64 })
          if ($LASTEXITCODE -ne 0 -or $installation.Count -ne 1) {
              throw 'Exactly one LabVIEW 2026 64-bit installation must be available.'
          }

      - name: Install DQMH Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Core.lvlib's actual VIs (Start Module.vi and others) call into
          # the Delacor QMH (DQMH) actor framework's own classes/VIs (e.g.
          # Delacor_lib_QMH_Module Admin.lvclass, installed under
          # <vilib>\Delacor\Delacor QMH\...) -- confirmed via run 42128420949's
          # Mass-Compile step, whose own log reported real "Search failed to
          # find ... <vilib>:\Delacor\..." resolution failures. This is the
          # actual real build-time dependency (not the 2 orphaned members
          # fixed in a prior commit); it ships on the standard public VIPM
          # feed, so install it by name, pinned for determinism.
          & vipm --labview-version 2026 --labview-bitness 64 install -y 'delacor_lib_dqmh_toolkit@7.1.2.1547'
          if ($LASTEXITCODE -ne 0) { throw "Installing the DQMH toolkit failed with exit code $LASTEXITCODE." }

      - name: Install dependencies .vip Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Core.lvlib previously carried two orphaned, pre-repo-split VI
          # references (KeyToVirtualKey.vi, KeybdEventSerializerLUT.vi),
          # removed in a prior commit. This step is kept for the real,
          # declared dependency on dependencies' own published package (see
          # vipm.toml) until a hosted feed lets vipm auto-resolve it.
          # Pinned to a specific, immutable release tag for determinism.
          $vipUrl = 'https://github.com/svelderrainruiz/dependencies/releases/download/vip-v1.0.0/lbap_dependencies-1.0.0.45.vip'
          $vipPath = Join-Path $env:RUNNER_TEMP 'lbap_dependencies-1.0.0.45.vip'
          Invoke-WebRequest -Uri $vipUrl -OutFile $vipPath
          & vipm --labview-version 2026 --labview-bitness 64 install -y $vipPath
          if ($LASTEXITCODE -ne 0) { throw "Installing dependencies' .vip package failed with exit code $LASTEXITCODE." }

      - name: Prepare Isolated Build Output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The 'core' Source Distribution spec's Bld_localDestDir/Destination
          # paths are a fixed, non-repo-relative location (same convention as
          # replay's own confirmed-working build spec) -- clear it first so
          # this job's output discovery below is unambiguous, since this
          # runner is dedicated to this repo and nothing else writes here.
          $outputRoot = 'C:\ProgramData\LabVIEW Benchmark Actor Plugins'
          if (Test-Path -LiteralPath $outputRoot) {
              Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }
          "OUTPUT_ROOT=$outputRoot" >> $env:GITHUB_ENV

      - name: Mass-Compile core Project (NI CAR#705294 mitigation)
        # Pre-build, non-fatal warming step for SandboxSBOMReporting#262's
        # "Call By Reference in lv_build.lvlib:build_project.vi.ProxyCaller"
        # (LabVIEWCLI error 1130, NI CAR#705294) -- confirmed live on run
        # 42127897685, the same failure svelderrainruiz/dependencies' own
        # build-lvlibp-candidate.yml already mitigates this same way. Unlike
        # that repo, Core.lvproj lives at the repository root rather than
        # inside src/, so MassCompile (scoped to src/ only) never touches it
        # and no project-file backup/restore is needed here.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE 'src'
          if (-not (Test-Path -LiteralPath $projectRoot -PathType Container)) {
              throw "core source directory was not checked out: $projectRoot"
          }
          $labviewDir = Get-ChildItem 'C:\Program Files\National Instruments' -Directory -Filter 'LabVIEW *' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          if (-not $labviewDir) {
              throw 'No LabVIEW installation found under C:\Program Files\National Instruments.'
          }
          $labviewExe = Join-Path $labviewDir.FullName 'LabVIEW.exe'
          if (-not (Test-Path -LiteralPath $labviewExe -PathType Leaf)) {
              throw "LabVIEW.exe not found at expected path: $labviewExe"
          }
          $cliCommand = Get-Command LabVIEWCLI.exe -ErrorAction SilentlyContinue
          $cliExe = if ($cliCommand) { $cliCommand.Source } else { Join-Path $labviewDir.FullName 'LabVIEWCLI.exe' }
          if (-not (Test-Path -LiteralPath $cliExe -PathType Leaf)) {
              throw "LabVIEWCLI.exe not found (checked PATH and '$cliExe')."
          }
          $logPath = Join-Path $env:RUNNER_TEMP 'masscompile.log'
          Write-Output "Mass-compiling $projectRoot with $labviewExe ..."

          # LabVIEWCLI writes its own operation output to stderr; relax
          # ErrorActionPreference so merging it with 2>&1 does not raise a
          # terminating NativeCommandError. This step's own exit code is
          # deliberately NOT checked -- MassCompile legitimately reports
          # individual VIs that depend on libraries absent from this
          # environment as failed without that indicating a real problem
          # (ni's own LabVIEW-CI-CD-Toolkit documents the same per-VI, not
          # whole-operation, pass/fail semantics). The actual build
          # validation remains the next step's real Source Distribution build.
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & $cliExe -LogToConsole TRUE -OperationName MassCompile -DirectoryToCompile $projectRoot -LabVIEWPath $labviewExe -Headless 2>&1 |
              Tee-Object -FilePath $logPath
          $massCompileExitCode = $LASTEXITCODE
          $ErrorActionPreference = $prevEAP
          Write-Output "Mass compile finished (exit code $massCompileExitCode, non-fatal); log: $logPath"
          # GitHub Actions' pwsh step wrapper fails the step on a non-zero
          # $LASTEXITCODE at script end regardless of any internal handling
          # above -- explicitly normalize it so this step's own non-fatal
          # intent actually takes effect.
          exit 0

      - name: Build core Source Distribution
        id: build_core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lvprojPath = Join-Path $env:GITHUB_WORKSPACE 'Core.lvproj'
          if (-not (Test-Path -LiteralPath $lvprojPath -PathType Leaf)) {
              throw "Core.lvproj is missing: $lvprojPath"
          }

          & vipm --labview-version 2026 --labview-bitness 64 build $lvprojPath --lvproj-build-spec core --lvproj-target "My Computer" --build-number ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { throw "vipm build failed with exit code $LASTEXITCODE." }

          # LabVIEW's build engine expands the spec's NI_AB_PROJECTNAME token
          # to the actual project name at build time; discover the resulting
          # folder instead of assuming its expanded name.
          $builtDirs = @(Get-ChildItem -LiteralPath $env:OUTPUT_ROOT -Directory -ErrorAction SilentlyContinue)
          if ($builtDirs.Count -ne 1) {
              throw "Expected exactly one output directory under $env:OUTPUT_ROOT, found $($builtDirs.Count)."
          }
          "BUILD_OUTPUT_DIR=$($builtDirs[0].FullName)" >> $env:GITHUB_ENV
          Write-Host "Built Source Distribution at $($builtDirs[0].FullName)"

      - name: Upload core Source Distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-source-distribution-${{ github.run_id }}
          path: ${{ env.BUILD_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
